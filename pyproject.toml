[project]
name = "shader-spec-eval"
version = "0.1.0"
description = "An experimental property-based evaluation for LLM-generated GLSL shaders"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Husien Vora" }]
keywords = ["llm", "evaluation", "glsl", "shader", "spatial-reasoning"]
dependencies = [
    "playwright>=1.45",
    "Pillow>=10.0",
]

[project.scripts]
shader-spec-eval = "shader_spec_eval.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Husienvora/shader-spec-eval"
Issues = "https://github.com/Husienvora/shader-spec-eval/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shader_spec_eval"]

[tool.hatch.build.targets.wheel.force-include]
"tasks" = "shader_spec_eval/tasks"

[tool.ruff]
line-length = 100
target-version = "py310"
